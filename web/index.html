<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>volume.tools · console</title>
<meta name="theme-color" content="#0a0e0b">
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #0a0e0b;
    --bg-side: #0f1410;
    --card: #121914;
    --card-hover: #1a241f;
    --border: #1d271f;
    --border-2: #2a3a2c;
    --fg: #e8ece8;
    --fg-dim: #6e7a70;
    --accent: #6ee7a8;
    --accent-dim: #3f9a6b;
    --danger: #ed4245;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--fg);
    display: flex; height: 100vh; overflow: hidden; font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  .sidebar {
    width: 420px; background: var(--bg-side); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .header {
    padding: 24px 24px 16px; border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
  }
  .brand-name { font-weight: 500; font-size: 15px; letter-spacing: -0.02em; }
  .brand-name span { color: var(--accent); }
  .brand-actions { display: flex; gap: 8px; }
  .brand-home {
    font-size: 11px; font-family: var(--mono); color: var(--fg-dim);
    text-decoration: none; padding: 4px 10px; border: 1px solid var(--border);
    border-radius: 4px; transition: 0.2s;
  }
  .brand-home:hover { background: var(--card); color: var(--fg); }
  .brand-home.signout { color: var(--danger); }

  .status-pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    font-size: 11px; font-family: var(--mono); color: var(--fg-dim); width: 100%;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(110,231,168,0.1); }
  .status-text { color: var(--fg); font-weight: 500; }
  .status-count { margin-left: auto; }

  .referral-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; margin-top: 12px; display: none;
  }
  .referral-card.show { display: block; }
  .ref-label { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-dim); font-family: var(--mono); margin-bottom: 6px; }
  .ref-code {
    font-family: var(--mono); font-size: 13px; color: var(--accent);
    cursor: pointer; padding: 6px; background: rgba(110,231,168,.06);
    border-radius: 4px; text-align: center; letter-spacing: .04em; transition: .15s;
  }
  .ref-code:hover { background: rgba(110,231,168,.1); }
  .ref-stats { font-size: 10px; color: var(--fg-dim); margin-top: 6px; font-family: var(--mono); }

  .composer { padding: 20px 24px; border-bottom: 1px solid var(--border); }
  .form-group { margin-bottom: 14px; }
  .form-label {
    display: block; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--fg-dim); margin-bottom: 6px;
    font-family: var(--mono); font-weight: 600;
  }
  .form-control {
    width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--fg); font-family: var(--sans); font-size: 13px;
    outline: none; transition: 0.2s;
  }
  .form-control:focus { border-color: var(--accent-dim); box-shadow: 0 0 0 2px rgba(110, 231, 168, 0.1); }
  .btn-primary {
    width: 100%; padding: 11px; background: var(--accent); color: #062a17; font-weight: 600;
    border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 13px;
    font-family: var(--mono);
  }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:disabled { background: var(--border); color: var(--fg-dim); cursor: not-allowed; }

  .results-status {
    padding: 10px 24px; font-family: var(--mono); font-size: 11px;
    color: var(--fg-dim); border-bottom: 1px solid var(--border);
    min-height: 38px; display: flex; align-items: center;
  }
  .results-list { flex: 1; overflow-y: auto; padding: 16px 24px; }
  .results-list::-webkit-scrollbar { width: 6px; }
  .results-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--fg-dim); font-size: 12px; line-height: 1.6; font-family: var(--mono); }
  .empty-icon { font-size: 24px; margin-bottom: 12px; opacity: 0.4; }

  .hit-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; margin-bottom: 10px; transition: 0.2s;
  }
  .hit-card:hover { border-color: var(--border-2); background: var(--card-hover); }
  .hit-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .hit-badge {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
    color: var(--accent); background: rgba(110, 231, 168, 0.1); padding: 2px 6px; border-radius: 4px;
    font-family: var(--mono);
  }
  .hit-kind { font-size: 10px; color: var(--fg-dim); font-family: var(--mono); }
  .hit-value { font-size: 13px; color: var(--fg); word-break: break-all; line-height: 1.4; }
  .hit-meta { font-size: 10px; color: var(--fg-dim); margin-top: 8px; font-family: var(--mono); }

  .graph-panel { flex: 1; position: relative; background: var(--bg); }
  .graph-bg {
    position: absolute; inset: 0;
    background-image: radial-gradient(var(--border) 1px, transparent 0);
    background-size: 32px 32px; opacity: 0.3;
  }
  #network { width: 100%; height: 100%; position: absolute; z-index: 1; }
  .graph-stats {
    position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; z-index: 2;
  }
  .stat-pill {
    background: rgba(15, 20, 16, 0.9); border: 1px solid var(--border); padding: 6px 12px;
    border-radius: 6px; font-family: var(--mono); font-size: 10px; color: var(--fg-dim);
    backdrop-filter: blur(8px); text-transform: uppercase; letter-spacing: 0.06em;
  }
  .stat-pill b { color: var(--fg); font-weight: 500; margin-left: 4px; }

  @media (max-width: 820px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; height: 65vh; border-right: none; border-bottom: 1px solid var(--border); }
    .graph-panel { height: 35vh; }
  }
</style>
</head>
<body>

<script>
  if (!localStorage.getItem('volume_token')) {
    window.location.href = '/login';
  }
</script>

<div class="sidebar">
  <div class="header">
    <div class="brand">
      <div class="brand-name">volume<span>.tools</span></div>
      <div class="brand-actions">
        <a href="/dashboard" class="brand-home">← dashboard</a>
        <a href="#" id="logout-btn" class="brand-home signout">sign out</a>
      </div>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      <span class="status-text">Connected</span>
      <span class="status-count" id="src-count">...</span>
    </div>
    <div class="referral-card" id="referral-card">
      <div class="ref-label">your referral code</div>
      <div class="ref-code" id="ref-code">VOL-REF-...</div>
      <div class="ref-stats" id="ref-stats">loading...</div>
    </div>
  </div>

  <div class="composer">
    <div class="form-group">
      <label class="form-label">Target Type</label>
      <select id="kind" class="form-control">
        <option value="email">Email</option>
        <option value="username">Username</option>
        <option value="ip">IP Address</option>
        <option value="discord_id">Discord ID</option>
        <option value="domain">Domain</option>
        <option value="phone">Phone</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Seed Artifact</label>
      <input id="seed" class="form-control" placeholder="Enter target..." autofocus autocomplete="off" spellcheck="false">
    </div>
    <button id="go" class="btn-primary">Execute Pivot</button>
  </div>

  <div class="results-status" id="status">Ready · Feed me an artifact</div>
  <div class="results-list" id="results">
    <div class="empty-state">
      <div class="empty-icon">◌</div>
      No data yet.<br>Drop a target above to begin.
    </div>
  </div>
</div>

<div class="graph-panel">
  <div class="graph-bg"></div>
  <div id="network"></div>
  <div class="graph-stats">
    <div class="stat-pill">nodes <b id="node-count">0</b></div>
    <div class="stat-pill">edges <b id="edge-count">0</b></div>
  </div>
</div>

<script>
(() => {
  const TOKEN = localStorage.getItem('volume_token');
  const API = window.location.hostname === 'localhost'
    ? 'http://localhost:8000'
    : 'https://volume-tools-2.onrender.com';

  const nodesDS = new vis.DataSet([]);
  const edgesDS = new vis.DataSet([]);
  const seen = new Set();

  const net = new vis.Network(
    document.getElementById('network'),
    { nodes: nodesDS, edges: edgesDS },
    {
      nodes: {
        shape: 'dot', size: 12, borderWidth: 1,
        font: { color: '#6e7a70', face: 'monospace', size: 11 },
        color: { background: '#121914', border: '#6ee7a8' }
      },
      edges: {
        color: { color: '#1d271f', highlight: '#6ee7a8' },
        width: 1, smooth: { type: 'dynamic' }
      },
      physics: {
        solver: 'forceAtlas2Based',
        forceAtlas2Based: { gravitationalConstant: -40, centralGravity: 0.015, springLength: 100, springConstant: 0.06, damping: 0.4 },
        stabilization: { iterations: 150 }
      },
      interaction: { hover: true, tooltipDelay: 200 }
    }
  );

  const updateStats = () => {
    document.getElementById('node-count').textContent = nodesDS.length;
    document.getElementById('edge-count').textContent = edgesDS.length;
  };

  const addNode = (id, label, isRoot = false) => {
    if (seen.has(id)) return;
    seen.add(id);
    nodesDS.add({
      id, label,
      size: isRoot ? 20 : 12,
      color: isRoot ? { background: '#6ee7a8', border: '#e8ece8' } : { background: '#121914', border: '#6ee7a8' },
      font: isRoot ? { color: '#0a0e0b', bold: true, face: 'monospace' } : { color: '#6e7a70', face: 'monospace' }
    });
    updateStats();
  };

  const addEdge = (from, to) => {
    edgesDS.add({ from, to, id: `${from}->${to}` });
    updateStats();
  };

  const setStatus = (text, isError = false) => {
    const el = document.getElementById('status');
    el.innerHTML = text;
    el.style.color = isError ? 'var(--danger)' : 'var(--fg-dim)';
  };

  const renderResults = (hits) => {
    const el = document.getElementById('results');
    if (!hits.length) {
      el.innerHTML = '<div class="empty-state"><div class="empty-icon">◌</div>No hits found.<br>Try a different target.</div>';
      return;
    }
    el.innerHTML = hits.map(h => `
      <div class="hit-card">
        <div class="hit-header">
          <span class="hit-badge">${h.pillar}</span>
          <span class="hit-kind">${h.kind}</span>
        </div>
        <div class="hit-value">${h.value}</div>
        <div class="hit-meta">via ${(h.meta.sources || []).join(', ')}</div>
      </div>
    `).join('');
  };

  document.getElementById('go').onclick = async () => {
    const seed = document.getElementById('seed').value.trim();
    const kind = document.getElementById('kind').value;
    if (!seed) return;

    const btn = document.getElementById('go');
    btn.disabled = true;
    setStatus(`Fanning out · ${kind}`);
    document.getElementById('results').innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div>Scanning sources...</div>';

    const rootId = kind + ':' + seed;
    addNode(rootId, seed.length > 18 ? seed.slice(0, 18) + '…' : seed, true);

    try {
      const res = await fetch(`${API}/api/pivot`, {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'authorization': `Bearer ${TOKEN}`
        },
        body: JSON.stringify({ seed, kind })
      });

      if (res.status === 402) {
        const d = await res.json();
        setStatus(`Limit reached · ${d.detail || 'upgrade'}`, true);
        renderResults([]);
        return;
      }

      const d = await res.json();
      setStatus(`Completed · ${d.count} hits`);
      renderResults(d.hits);

      d.hits.forEach(h => {
        const id = h.kind + ':' + h.value;
        addNode(id, String(h.value).slice(0, 18), false);
        addEdge(rootId, id);
      });
    } catch (e) {
      setStatus(`Error · ${e.message}`, true);
      renderResults([]);
    } finally {
      btn.disabled = false;
    }
  };

  fetch(`${API}/api/health`)
    .then(r => r.json())
    .then(d => {
      document.getElementById('src-count').textContent = d.sources.length + ' sources';
    })
    .catch(() => {});

  fetch(`${API}/api/referrals/me`, {
    headers: { 'authorization': `Bearer ${TOKEN}` }
  })
    .then(r => r.json())
    .then(d => {
      if (!d.code) return;
      const card = document.getElementById('referral-card');
      const codeEl = document.getElementById('ref-code');
      const statsEl = document.getElementById('ref-stats');
      codeEl.textContent = d.code;
      codeEl.onclick = () => {
        navigator.clipboard.writeText(d.code);
        codeEl.textContent = 'copied ✓';
        setTimeout(() => { codeEl.textContent = d.code; }, 1200);
      };
      statsEl.textContent = `${d.stats.used} used · ${d.stats.earned_days} days earned · ${d.stats.remaining_slots}/3 slots`;
      card.classList.add('show');
    })
    .catch(() => {});

  document.getElementById('logout-btn').onclick = async (e) => {
    e.preventDefault();
    try {
      await fetch(`${API}/api/auth/logout`, {
        method: 'POST',
        headers: { 'authorization': `Bearer ${TOKEN}` }
      });
    } catch (err) {}
    localStorage.removeItem('volume_token');
    localStorage.removeItem('volume_email');
    localStorage.removeItem('volume_tier');
    window.location.href = '/login';
  };
})();
</script>
</body>
</html>
